name: Build and Push Docker Image

on:
  push:
    tags:
      # Semver only: the tag list below is built entirely out of the parsed
      # version, and a tag that does not parse would yield no tags at all.
      - 'v*.*.*'

env:
  REGISTRY: docker.io
  IMAGE_NAME: myceliummesh/amneziawg-ui
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Every compiler in the Dockerfile cross-compiles, so QEMU is only ever
      # asked to run apk and busybox while the final arm64 layer is assembled.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The version is what names the image, so the "v" of the git tag is
          # dropped: v3.1.1 publishes as 3.1.1, 3.1, 3 and - via latest=auto,
          # which skips pre-releases - latest. v3.2.0-rc1 gets 3.2.0-rc1 alone.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify pushed image
        run: |
          echo "Image successfully pushed to Docker Hub"
          echo "Platforms: ${{ env.PLATFORMS }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
